{% extends "base.html" %}
{% block title %}Log in · Job Tracker{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:0 auto">
  <h2>Log in</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">No account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
